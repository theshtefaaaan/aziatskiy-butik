<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Азиатский бутик</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600&family=PT+Mono&display=swap">
<style>
/* Layout: wholesale catalogue — fixed segment index on the left, a plain ruled price list on the right */
:root{
  --bg:#ffffff;
  --ink:#161615;
  --muted:#7a7a73;
  --line:#e9e9e4;
  --hover:#f5f5f1;
  --focus:#2f5bd3;
  --sans:"Onest",-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  --mono:"PT Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#151514;--ink:#ececE6;--muted:#93938b;--line:#2a2a28;--hover:#1d1d1b;--focus:#7ea0ff;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#151514;--ink:#ececE6;--muted:#93938b;--line:#2a2a28;--hover:#1d1d1b;--focus:#7ea0ff;color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:400 15px/1.45 var(--sans);-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.wrap{max-width:1180px;margin:0 auto;padding-inline:24px}

header.top{border-bottom:1px solid var(--line)}
header.top .wrap{display:flex;align-items:baseline;justify-content:space-between;gap:16px;flex-wrap:wrap;padding-block:22px 18px}
.brand{font-size:22px;font-weight:600;letter-spacing:-.02em;margin:0}
.brand a{color:inherit;text-decoration:none}
.meta{color:var(--muted);font-size:13px}

.layout{display:grid;grid-template-columns:250px minmax(0,1fr);gap:56px;padding-block:32px 80px}

/* index */
nav.index{position:sticky;top:calc(env(safe-area-inset-top,0px) + 24px);align-self:start;max-height:calc(100vh - 48px);overflow:auto;padding-right:4px}
.switch{display:flex;gap:18px;margin-bottom:18px;font-size:13px}
.switch button{background:none;border:0;padding:0 0 4px;color:var(--muted);cursor:pointer;border-bottom:1px solid transparent}
.switch button[aria-pressed="true"]{color:var(--ink);border-bottom-color:var(--ink)}
.seglist{list-style:none;margin:0;padding:0}
.seglist a{display:flex;justify-content:space-between;gap:12px;padding:5px 0;color:var(--muted);text-decoration:none;font-size:14px;line-height:1.3}
.seglist a:hover{color:var(--ink)}
.seglist a[aria-current="true"]{color:var(--ink);font-weight:500}
.seglist .n{font-variant-numeric:tabular-nums;font-size:12px;padding-top:2px}
.seglist li.all{padding-bottom:8px;margin-bottom:8px;border-bottom:1px solid var(--line)}

/* main */
.kind{font-size:12px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase;margin:0 0 6px}
h2.title{font-size:34px;line-height:1.1;font-weight:500;letter-spacing:-.025em;margin:0;text-wrap:balance}
.facts{color:var(--muted);margin:10px 0 0;font-size:14px;font-variant-numeric:tabular-nums}
.tools{display:flex;gap:12px;align-items:center;margin:28px 0 8px;flex-wrap:wrap}
.search{flex:1 1 260px;min-width:0;border:0;border-bottom:1px solid var(--line);background:transparent;padding:8px 0;font-size:15px;outline:none;border-radius:0}
.search:focus{border-bottom-color:var(--ink)}
.search::placeholder{color:var(--muted)}
.sort{border:0;background:transparent;color:var(--muted);font-size:13px;padding:8px 0;cursor:pointer}

.group{margin-top:34px}
.group h3{font-size:12px;font-weight:500;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:0 0 4px;display:flex;justify-content:space-between}
.group h3 a{color:inherit;text-decoration:none}
.group h3 a:hover{color:var(--ink)}
.rows{list-style:none;margin:0;padding:0;border-top:1px solid var(--ink)}
.row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 24px;padding:13px 8px 12px;margin-inline:-8px;border-bottom:1px solid var(--line)}
.row:hover{background:var(--hover)}
.name{font-size:15px;min-width:0}
.pack{font-family:var(--mono);font-size:12px;color:var(--muted);margin-left:8px;white-space:nowrap}
.price{text-align:right;font-variant-numeric:tabular-nums;font-weight:500;white-space:nowrap}
.price small{display:block;font-weight:400;font-size:12px;color:var(--muted)}
.tags{grid-column:1/-1;font-size:12px;color:var(--muted);display:flex;flex-wrap:wrap;gap:2px 0;margin-top:-2px}
.tags a{color:inherit;text-decoration:none}
.tags a:hover{color:var(--ink);text-decoration:underline;text-underline-offset:2px}
.tags a+a::before{content:"·";padding:0 7px;color:var(--line)}
.code{font-family:var(--mono);font-size:11px;color:var(--muted);margin-right:10px}
.empty{color:var(--muted);padding:40px 0}

footer{border-top:1px solid var(--line);color:var(--muted);font-size:13px}
footer .wrap{padding-block:22px 28px;display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap}

@media (max-width:820px){
  .wrap{padding-inline:16px}
  .layout{grid-template-columns:minmax(0,1fr);gap:20px;padding-block:20px 60px}
  nav.index{position:static;max-height:none;overflow:visible;padding:0}
  .seglist{display:flex;gap:8px;overflow-x:auto;padding-bottom:8px;margin-inline:-16px;padding-inline:16px;scrollbar-width:none}
  .seglist li{flex:0 0 auto}
  .seglist li.all{border:0;margin:0;padding:0}
  .seglist a{border:1px solid var(--line);border-radius:999px;padding:6px 12px;white-space:nowrap;gap:8px}
  .seglist a[aria-current="true"]{border-color:var(--ink)}
  h2.title{font-size:26px}
  .pack{display:block;margin:2px 0 0;white-space:normal}
}
@media (prefers-reduced-motion:no-preference){.row{transition:background .12s}}
</style>

    <div id="list"></div>

</div>

<footer><div class="wrap">

</div></footer>

ая, европейская кухня, столовые","ЗОЖ, веган, боул-бары","Восточная: узбекская, кавказская"]},{"n":279,"name":"Филе лосося охл, кг","p":2535,"c":"Морепродукты и рыба","t":["Японская кухня и суши","Средиземноморская, итальянская, пиццерии","Кафе, кофейни, десерты","Русская, европейская кухня, столовые","ЗОЖ, веган, боул-бары"]},{"n":280,"name":"Циновка 27*27, 1 шт, шт","p":164,"c":"Непищевое и сервировка","t":["Японская кухня и суши"]},{"n":281,"name":"Чай \"Алисам\", кг","p":845,"c":"Напитки и снеки","t":["Кафе, кофейни, десерты","Русская, европейская кухня, столовые","Восточная: узбекская, кавказская"]},{"n":282,"name":"Чипсы креветочные, 227 гр, шт","p":115,"c":"Напитки и снеки","t":["Паназиатская, тайская, вьетнамская","Фастфуд, бургерные, бары"]},{"n":283,"name":"Шпинат зам, вес, кг","p":226,"c":"Замороженные овощи, ягоды, фрукты","t":["Средиземноморская, итальянская, пиццерии","Кафе, кофейни, десерты","Русская, европейская кухня, столовые","ЗОЖ, веган, боул-бары","Восточная: узбекская, кавказская"]},{"n":284,"name":"Ягоды Годжи, 1кг, шт","p":1600,"c":"Орехи, семена, суперфуды","t":["Кафе, кофейни, десерты","ЗОЖ, веган, боул-бары"]}]};
const SHORT = {
  "Японская кухня и суши":"Японская, суши",
  "Паназиатская, тайская, вьетнамская":"Паназия",
  "Китайская кухня":"Китайская",
  "Корейская кухня":"Корейская",
  "Средиземноморская, итальянская, пиццерии":"Италия, пицца",
  "Кафе, кофейни, десерты":"Кофейни",
  "Фастфуд, бургерные, бары":"Фастфуд, бары",
  "Русская, европейская кухня, столовые":"Европейская, столовые",
  "ЗОЖ, веган, боул-бары":"ЗОЖ, веган",
  "Восточная: узбекская, кавказская":"Восточная"
};
const UNIT = {"шт":"за шт","кг":"за кг","упаковка":"за упаковку"};
const items = DATA.items.map(it=>{
  const parts = it.name.split(/,\s+/).map(s=>s.trim());
  let unit = "";
  if (parts.length>1 && UNIT[parts[parts.length-1]]) unit = UNIT[parts.pop()];
  return {...it, title: parts[0], pack: parts.slice(1).join(" · "), unit};
});
const nf = new Intl.NumberFormat("ru-RU");
const rub = v => nf.format(Math.round(v)) + " ₽";
const plural = (n,a,b,c)=>{const m=n%10,h=n%100;return n+" "+(m===1&&h!==11?a:m>=2&&m<=4&&(h<10||h>=20)?b:c)};

const segs = { all:{kind:"Весь прайс",label:"Все товары",list:items} };
DATA.cats.forEach((c,i)=>segs["c"+i]={kind:"Категория товара",label:c,list:items.filter(x=>x.c===c),mode:"cat"});
DATA.types.forEach((t,i)=>segs["t"+i]={kind:"Тип заведения",label:t,list:items.filter(x=>x.t.includes(t)),mode:"type"});
const catKey = c => "c"+DATA.cats.indexOf(c);
const typeKey = t => "t"+DATA.types.indexOf(t);

const $ = id => document.getElementById(id);
$("meta").textContent = `Прайс-лист · октябрь 2026 · ${plural(items.length,"позиция","позиции","позиций")}`;

let nav = "cat", current = "all";
function store(k,v){try{localStorage.setItem(k,v)}catch(e){}}
function load(k){try{return localStorage.getItem(k)}catch(e){return null}}

function renderNav(){
  $("by-cat").setAttribute("aria-pressed", nav==="cat");
  $("by-type").setAttribute("aria-pressed", nav==="type");
  const keys = Object.keys(segs).filter(k=>k[0]===(nav==="cat"?"c":"t"));
  if (nav==="type") keys.sort((a,b)=>segs[b].list.length-segs[a].list.length);
  const li = k => `<li class="${k==='all'?'all':''}"><a href="#${k}" ${k===current?'aria-current="true"':''}><span>${segs[k].label}</span><span class="n">${segs[k].list.length}</span></a></li>`;
  $("seglist").innerHTML = li("all") + keys.map(li).join("");
  const a=$("seglist").querySelector("[aria-current]"); if(a&&matchMedia("(max-width:820px)").matches) a.scrollIntoView({block:"nearest",inline:"center"});
}

function rowHTML(x, showTags){
  const tags = showTags==="types"
    ? x.t.map(t=>`<a href="#${typeKey(t)}">${SHORT[t]||t}</a>`).join("")
    : showTags==="cat" && x.c ? `<a href="#${catKey(x.c)}">${x.c}</a>` : "";
  return `<li class="row">
    <div class="name"><span class="code">${x.n}</span>${x.title}${x.pack?`<span class="pack">${x.pack}</span>`:""}</div>
    <div class="price">${rub(x.p)}<small>${x.unit}</small></div>
    ${tags?`<div class="tags">${tags}</div>`:""}
  </li>`;
}

function sorted(list){
  const s = $("sort").value, c = new Intl.Collator("ru");
  const l = [...list];
  if (s==="name") l.sort((a,b)=>c.compare(a.title,b.title));
  if (s==="asc") l.sort((a,b)=>a.p-b.p);
  if (s==="desc") l.sort((a,b)=>b.p-a.p);
  if (s==="code") l.sort((a,b)=>a.n-b.n);
  return l;
}

function renderList(){
  const seg = segs[current];
  const q = $("q").value.trim().toLowerCase();
  const list = q ? seg.list.filter(x=>x.name.toLowerCase().includes(q)) : seg.list;
  if (!list.length){ $("list").innerHTML = `<p class="empty">В разделе «${seg.label}» нет позиций по запросу «${$("q").value.trim()}». Проверьте написание или поищите во всех товарах.</p>`; return; }
  if (seg.mode==="cat"){
    $("list").innerHTML = `<ul class="rows">${sorted(list).map(x=>rowHTML(x,"types")).join("")}</ul>`;
    return;
  }
  // group by product category, in price-list category order
  const groups = DATA.cats.map(c=>[c, list.filter(x=>x.c===c)]).filter(g=>g[1].length);
  $("list").innerHTML = groups.map(([c,l])=>`<section class="group">
      <h3><a href="#${catKey(c)}">${c}</a><span>${l.length}</span></h3>
      <ul class="rows">${sorted(l).map(x=>rowHTML(x, seg.mode==="type"?null:"types")).join("")}</ul>
    </section>`).join("");
}

function render(){
  const seg = segs[current];
  $("kind").textContent = seg.kind;
  $("title").textContent = seg.label;
  const ps = seg.list.map(x=>x.p);
  const avg = ps.reduce((a,b)=>a+b,0)/ps.length;
  $("facts").textContent = `${plural(ps.length,"позиция","позиции","позиций")} · от ${rub(Math.min(...ps))} до ${rub(Math.max(...ps))} · в среднем ${rub(avg)}`;
  renderNav(); renderList();
}

function fromHash(){
  const h = location.hash.slice(1);
  current = segs[h] ? h : "all";
  if (current[0]==="c") nav="cat";
  if (current[0]==="t") nav="type";
  $("q").value = "";
  render();
}
$("by-cat").onclick = ()=>{nav="cat";store("nav",nav);renderNav()};
$("by-type").onclick = ()=>{nav="type";store("nav",nav);renderNav()};
$("q").addEventListener("input", renderList);
$("sort").addEventListener("change", ()=>{store("sort",$("sort").value);renderList()});
window.addEventListener("hashchange", ()=>{fromHash(); if (window.scrollY>200) window.scrollTo({top:0})});

nav = load("nav")==="type" ? "type" : "cat";
const s = load("sort"); if (s && $("sort").querySelector(`option[value="${s}"]`)) $("sort").value = s;
fromHash();
</script>

</body></html>
