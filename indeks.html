<title>Азиатский бутик</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600&family=PT+Mono&display=swap">
<style>
/* Layout: wholesale catalogue — fixed segment index on the left, a plain ruled price list on the right */
:root{
  --bg:#ffffff;
  --ink:#161615;
  --muted:#7a7a73;
  --line:#e9e9e4;
  --hover:#f5f5f1;
  --focus:#2f5bd3;
  --sans:"Onest",-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  --mono:"PT Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#151514;--ink:#ececE6;--muted:#93938b;--line:#2a2a28;--hover:#1d1d1b;--focus:#7ea0ff;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#151514;--ink:#ececE6;--muted:#93938b;--line:#2a2a28;--hover:#1d1d1b;--focus:#7ea0ff;color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:400 15px/1.45 var(--sans);-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.wrap{max-width:1180px;margin:0 auto;padding-inline:24px}

header.top{border-bottom:1px solid var(--line)}
header.top .wrap{display:flex;align-items:baseline;justify-content:space-between;gap:16px;flex-wrap:wrap;padding-block:22px 18px}
.brand{font-size:22px;font-weight:600;letter-spacing:-.02em;margin:0}
.brand a{color:inherit;text-decoration:none}
.meta{color:var(--muted);font-size:13px}

.layout{display:grid;grid-template-columns:250px minmax(0,1fr);gap:56px;padding-block:32px 80px}

/* index */
nav.index{position:sticky;top:calc(env(safe-area-inset-top,0px) + 24px);align-self:start;max-height:calc(100vh - 48px);overflow:auto;padding-right:4px}
.switch{display:flex;gap:18px;margin-bottom:18px;font-size:13px}
.switch button{background:none;border:0;padding:0 0 4px;color:var(--muted);cursor:pointer;border-bottom:1px solid transparent}
.switch button[aria-pressed="true"]{color:var(--ink);border-bottom-color:var(--ink)}
.seglist{list-style:none;margin:0;padding:0}
.seglist a{display:flex;justify-content:space-between;gap:12px;padding:5px 0;color:var(--muted);text-decoration:none;font-size:14px;line-height:1.3}
.seglist a:hover{color:var(--ink)}
.seglist a[aria-current="true"]{color:var(--ink);font-weight:500}
.seglist .n{font-variant-numeric:tabular-nums;font-size:12px;padding-top:2px}
.seglist li.all{padding-bottom:8px;margin-bottom:8px;border-bottom:1px solid var(--line)}

/* main */
.kind{font-size:12px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase;margin:0 0 6px}
h2.title{font-size:34px;line-height:1.1;font-weight:500;letter-spacing:-.025em;margin:0;text-wrap:balance}
.facts{color:var(--muted);margin:10px 0 0;font-size:14px;font-variant-numeric:tabular-nums}
.tools{display:flex;gap:12px;align-items:center;margin:28px 0 8px;flex-wrap:wrap}
.search{flex:1 1 260px;min-width:0;border:0;border-bottom:1px solid var(--line);background:transparent;padding:8px 0;font-size:15px;outline:none;border-radius:0}
.search:focus{border-bottom-color:var(--ink)}
.search::placeholder{color:var(--muted)}
.sort{border:0;background:transparent;color:var(--muted);font-size:13px;padding:8px 0;cursor:pointer}

.group{margin-top:34px}
.group h3{font-size:12px;font-weight:500;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:0 0 4px;display:flex;justify-content:space-between}
.group h3 a{color:inherit;text-decoration:none}
.group h3 a:hover{color:var(--ink)}
.rows{list-style:none;margin:0;padding:0;border-top:1px solid var(--ink)}
.row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 24px;padding:13px 8px 12px;margin-inline:-8px;border-bottom:1px solid var(--line)}
.row:hover{background:var(--hover)}
.name{font-size:15px;min-width:0}
.pack{font-family:var(--mono);font-size:12px;color:var(--muted);margin-left:8px;white-space:nowrap}
.price{text-align:right;font-variant-numeric:tabular-nums;font-weight:500;white-space:nowrap}
.price small{display:block;font-weight:400;font-size:12px;color:var(--muted)}
.tags{grid-column:1/-1;font-size:12px;color:var(--muted);display:flex;flex-wrap:wrap;gap:2px 0;margin-top:-2px}
.tags a{color:inherit;text-decoration:none}
.tags a:hover{color:var(--ink);text-decoration:underline;text-underline-offset:2px}
.tags a+a::before{content:"·";padding:0 7px;color:var(--line)}
.code{font-family:var(--mono);font-size:11px;color:var(--muted);margin-right:10px}
.empty{color:var(--muted);padding:40px 0}

footer{border-top:1px solid var(--line);color:var(--muted);font-size:13px}
footer .wrap{padding-block:22px 28px;display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap}

@media (max-width:820px){
  .wrap{padding-inline:16px}
  .layout{grid-template-columns:minmax(0,1fr);gap:20px;padding-block:20px 60px}
  nav.index{position:static;max-height:none;overflow:visible;padding:0}
  .seglist{display:flex;gap:8px;overflow-x:auto;padding-bottom:8px;margin-inline:-16px;padding-inline:16px;scrollbar-width:none}
  .seglist li{flex:0 0 auto}
  .seglist li.all{border:0;margin:0;padding:0}
  .seglist a{border:1px solid var(--line);border-radius:999px;padding:6px 12px;white-space:nowrap;gap:8px}
  .seglist a[aria-current="true"]{border-color:var(--ink)}
  h2.title{font-size:26px}
  .pack{display:block;margin:2px 0 0;white-space:normal}
}
@media (prefers-reduced-motion:no-preference){.row{transition:background .12s}}
/* cart */
.top-right{display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.minorder{color:var(--muted);font-size:13px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--ink);background:var(--ink);color:var(--bg);border-radius:999px;padding:9px 18px;font-size:14px;font-weight:500;cursor:pointer;white-space:nowrap}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn.ghost:hover{border-color:var(--ink)}
.btn:disabled{background:var(--line);border-color:var(--line);color:var(--muted);cursor:not-allowed}
.btn.wide{width:100%;padding:13px 18px;font-size:15px}
.cnt{font-variant-numeric:tabular-nums}

.row{grid-template-columns:minmax(0,1fr) auto 118px;align-items:center}
.ctl{display:flex;justify-content:flex-end}
.add{border:1px solid var(--line);background:transparent;border-radius:999px;padding:6px 14px;font-size:13px;cursor:pointer;white-space:nowrap}
.add:hover{border-color:var(--ink)}
.step{display:inline-flex;align-items:center;border:1px solid var(--ink);border-radius:999px;overflow:hidden}
.step button{width:32px;height:30px;border:0;background:transparent;cursor:pointer;font-size:16px;line-height:1}
.step button:hover{background:var(--hover)}
.step output{min-width:28px;text-align:center;font-variant-numeric:tabular-nums;font-size:14px;font-weight:500}

.bar{height:3px;background:var(--line);border-radius:3px;overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--ink);width:0}
@media (prefers-reduced-motion:no-preference){.bar i{transition:width .2s}}

.cartbar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--bg);border-top:1px solid var(--line);padding:12px 0 calc(12px + env(safe-area-inset-bottom,0px))}
.cartbar .wrap{display:flex;align-items:center;gap:16px}
.cartbar .info{flex:1;min-width:0;max-width:420px}
.cartbar .sum{font-weight:600;font-variant-numeric:tabular-nums}
.cartbar .cbc{color:var(--muted);font-size:13px;margin-left:6px}
.cartbar .hint{font-size:13px;color:var(--muted);margin-top:2px}
.cartbar .btn{margin-left:auto}
body.has-cart{padding-bottom:92px}
body:has(dialog[open]){overflow:hidden}

dialog.drawer{margin:0 0 0 auto;height:100%;max-height:100%;width:min(460px,100%);max-width:100%;border:0;border-left:1px solid var(--line);padding:0;background:var(--bg);color:var(--ink)}
dialog.drawer::backdrop{background:rgba(0,0,0,.35)}
.dw{display:flex;flex-direction:column;height:100%}
.dw-form{display:flex;flex-direction:column;flex:1;min-height:0}
.dw-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding:calc(18px + env(safe-area-inset-top,0px)) 20px 14px;border-bottom:1px solid var(--line)}
.dw-head h2{font-size:22px;font-weight:500;margin:0;letter-spacing:-.015em;outline:none}
.back{display:block;margin-bottom:6px}
.x{border:0;background:none;font-size:24px;line-height:1;cursor:pointer;color:var(--muted);width:36px;height:36px;margin:-6px -8px 0 0}
.x:hover{color:var(--ink)}
.dw-body{flex:1;overflow:auto;padding:4px 20px 20px}
.dw-foot{border-top:1px solid var(--line);padding:16px 20px calc(16px + env(safe-area-inset-bottom,0px))}
.ci{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px 16px;padding:14px 0;border-bottom:1px solid var(--line)}
.ci .t{font-size:14px}
.ci .pk{font-family:var(--mono);font-size:11px;color:var(--muted);display:block;margin-top:2px}
.ci .lp{text-align:right;font-weight:500;font-variant-numeric:tabular-nums;white-space:nowrap}
.ci .lp small{display:block;font-weight:400;color:var(--muted);font-size:12px}
.ci .acts{grid-column:1/-1;display:flex;justify-content:space-between;align-items:center}
.rm{border:0;background:none;color:var(--muted);font-size:13px;cursor:pointer;padding:0;text-decoration:underline;text-underline-offset:2px}
.rm:hover{color:var(--ink)}
.total{display:flex;justify-content:space-between;align-items:baseline;font-size:15px}
.total b{font-size:22px;font-weight:600;font-variant-numeric:tabular-nums}
.need{font-size:13px;color:var(--muted);margin:8px 0 14px}
.need.ok{color:var(--ink)}
.dw-empty{color:var(--muted);padding:40px 0}

.sumline{display:flex;justify-content:space-between;font-size:14px;color:var(--muted);padding:16px 0 12px;font-variant-numeric:tabular-nums}
.sumline b{color:var(--ink);font-weight:500}
.who{border:0;padding:0;margin:0;display:grid;gap:10px}
.who label{display:block;border:1px solid var(--line);border-radius:12px;padding:13px 16px 13px 44px;position:relative;cursor:pointer}
.who label:has(input:checked){border-color:var(--ink)}
.who input{position:absolute;left:16px;top:16px;accent-color:var(--ink)}
.who b{display:block;font-weight:500}
.who span{display:block;font-size:13px;color:var(--muted);margin-top:2px}
.sec{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:22px 0 10px;padding:0}
.fld{display:block;margin-top:12px}
.fld span{display:block;font-size:13px;color:var(--muted);margin-bottom:4px}
.fld input,.fld textarea{width:100%;border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:transparent;font-size:15px}
.fld input:focus,.fld textarea:focus{outline:none;border-color:var(--ink)}
.fld textarea{min-height:72px;resize:vertical}
.two{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
.agree{display:flex;gap:10px;font-size:13px;color:var(--muted);margin-top:18px;align-items:flex-start;cursor:pointer}
.agree input{margin-top:2px;accent-color:var(--ink)}
.note{font-size:13px;color:var(--muted);margin:10px 0 0;text-align:center}
.done{padding:36px 0 20px}
.done h3{font-size:24px;font-weight:500;margin:0 0 10px;letter-spacing:-.02em}
.done p{color:var(--muted);margin:0 0 10px}
.demo{display:inline-block;font-size:11px;letter-spacing:.06em;text-transform:uppercase;border:1px solid var(--line);border-radius:999px;padding:3px 9px;color:var(--muted);margin-bottom:16px}

@media (max-width:820px){
  .row{grid-template-columns:minmax(0,1fr) auto}
  .ctl{grid-column:2;grid-row:2}
  .tags{grid-column:1;grid-row:2;margin-top:0}
  .minorder{font-size:12px}
}
@media (max-width:520px){.two{grid-template-columns:1fr}}
</style>

const SHORT = {
  "Японская кухня и суши":"Японская, суши",
  "Паназиатская, тайская, вьетнамская":"Паназия",

  "Кафе, кофейни, десерты":"Кофейни",

  "Русская, европейская кухня, столовые":"Европейская, столовые",
  "ЗОЖ, веган, боул-бары":"ЗОЖ, веган",
  "Восточная: узбекская, кавказская":"Восточная"
};
const UNIT = {"шт":"за шт","кг":"за кг","упаковка":"за упаковку"};
const items = DATA.items.map(it=>{
  const parts = it.name.split(/,\s+/).map(s=>s.trim());
  let unit = "";
  if (parts.length>1 && UNIT[parts[parts.length-1]]) unit = UNIT[parts.pop()];
  return {...it, title: parts[0], pack: parts.slice(1).join(" · "), unit};
});
const nf = new Intl.NumberFormat("ru-RU");
const rub = v => nf.format(Math.round(v)) + " ₽";
const plural = (n,a,b,c)=>{const m=n%10,h=n%100;return n+" "+(m===1&&h!==11?a:m>=2&&m<=4&&(h<10||h>=20)?b:c)};

const segs = { all:{kind:"Весь прайс",label:"Все товары",list:items} };
DATA.cats.forEach((c,i)=>segs["c"+i]={kind:"Категория товара",label:c,list:items.filter(x=>x.c===c),mode:"cat"});
DATA.types.forEach((t,i)=>segs["t"+i]={kind:"Тип заведения",label:t,list:items.filter(x=>x.t.includes(t)),mode:"type"});
const catKey = c => "c"+DATA.cats.indexOf(c);
const typeKey = t => "t"+DATA.types.indexOf(t);

const $ = id => document.getElementById(id);

let nav = "cat", current = "all";
function store(k,v){try{localStorage.setItem(k,v)}catch(e){}}
function load(k){try{return localStorage.getItem(k)}catch(e){return null}}

function renderNav(){
  $("by-cat").setAttribute("aria-pressed", nav==="cat");
  $("by-type").setAttribute("aria-pressed", nav==="type");
  const keys = Object.keys(segs).filter(k=>k[0]===(nav==="cat"?"c":"t"));
  if (nav==="type") keys.sort((a,b)=>segs[b].list.length-segs[a].list.length);
  const li = k => `<li class="${k==='all'?'all':''}"><a href="#${k}" ${k===current?'aria-current="true"':''}><span>${segs[k].label}</span><span class="n">${segs[k].list.length}</span></a></li>`;
  $("seglist").innerHTML = li("all") + keys.map(li).join("");
  const a=$("seglist").querySelector("[aria-current]"); if(a&&matchMedia("(max-width:820px)").matches) a.scrollIntoView({block:"nearest",inline:"center"});
}

function rowHTML(x, showTags){
  const tags = showTags==="types"
    ? x.t.map(t=>`<a href="#${typeKey(t)}">${SHORT[t]||t}</a>`).join("")
    : showTags==="cat" && x.c ? `<a href="#${catKey(x.c)}">${x.c}</a>` : "";
  return `<li class="row">
    <div class="name"><span class="code">${x.n}</span>${x.title}${x.pack?`<span class="pack">${x.pack}</span>`:""}</div>
    <div class="price">${rub(x.p)}<small>${x.unit}</small></div>
    <div class="ctl" data-ctl="${x.n}">${ctlHTML(x.n)}</div>
    ${tags?`<div class="tags">${tags}</div>`:""}
  </li>`;
}

function sorted(list){
  const s = $("sort").value, c = new Intl.Collator("ru");
  const l = [...list];
  if (s==="name") l.sort((a,b)=>c.compare(a.title,b.title));
  if (s==="asc") l.sort((a,b)=>a.p-b.p);
  if (s==="desc") l.sort((a,b)=>b.p-a.p);
  if (s==="code") l.sort((a,b)=>a.n-b.n);
  return l;
}

function renderList(){
  const seg = segs[current];
  const q = $("q").value.trim().toLowerCase();
  const list = q ? seg.list.filter(x=>x.name.toLowerCase().includes(q)) : seg.list;
  if (!list.length){ $("list").innerHTML = `<p class="empty">В разделе «${seg.label}» нет позиций по запросу «${$("q").value.trim()}». Проверьте написание или поищите во всех товарах.</p>`; return; }
  if (seg.mode==="cat"){
    $("list").innerHTML = `<ul class="rows">${sorted(list).map(x=>rowHTML(x,"types")).join("")}</ul>`;
    return;
  }
  // group by product category, in price-list category order
  const groups = DATA.cats.map(c=>[c, list.filter(x=>x.c===c)]).filter(g=>g[1].length);
  $("list").innerHTML = groups.map(([c,l])=>`<section class="group">
      <h3><a href="#${catKey(c)}">${c}</a><span>${l.length}</span></h3>
      <ul class="rows">${sorted(l).map(x=>rowHTML(x, seg.mode==="type"?null:"types")).join("")}</ul>
    </section>`).join("");
}

function render(){
  const seg = segs[current];
  $("kind").textContent = seg.kind;
  $("title").textContent = seg.label;
  $("facts").textContent = plural(seg.list.length,"позиция","позиции","позиций");
  renderNav(); renderList();
}

function fromHash(){
  const h = location.hash.slice(1);
  current = segs[h] ? h : "all";
  if (current[0]==="c") nav="cat";
  if (current[0]==="t") nav="type";
  $("q").value = "";
  render();
}
$("by-cat").onclick = ()=>{nav="cat";store("nav",nav);renderNav()};
$("by-type").onclick = ()=>{nav="type";store("nav",nav);renderNav()};
$("q").addEventListener("input", renderList);
$("sort").addEventListener("change", ()=>{store("sort",$("sort").value);renderList()});
window.addEventListener("hashchange", ()=>{fromHash(); if (window.scrollY>200) window.scrollTo({top:0})});

/* ===== Корзина ===== */
const MIN = 7000;
const byN = Object.fromEntries(items.map(x=>[x.n,x]));
const esc = s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let cart = {};
try{ const c = JSON.parse(load("cart")||"{}"); for (const k in c) if (byN[k] && c[k]>0) cart[k]=Math.min(999,Math.floor(c[k])); }catch(e){}
const saveCart = ()=>store("cart", JSON.stringify(cart));
const cartLines = ()=>Object.keys(cart).map(k=>({...byN[k], q:cart[k]})).sort((a,b)=>a.n-b.n);
const cartSum = ()=>cartLines().reduce((a,x)=>a+x.p*x.q,0);
const posWord = n=>plural(n,"позиция","позиции","позиций");

function ctlHTML(n){
  const q = cart[n]||0, t = esc(byN[n].title);
  return q
    ? `<span class="step"><button type="button" data-dec="${n}" aria-label="Убрать одну: ${t}">−</button><output aria-live="polite">${q}</output><button type="button" data-inc="${n}" aria-label="Добавить ещё: ${t}">+</button></span>`
    : `<button type="button" class="add" data-inc="${n}" aria-label="В корзину: ${t}">В корзину</button>`;
}

function setQty(n,q){
  q = Math.max(0,Math.min(999,q));
  if (q) cart[n]=q; else delete cart[n];
  saveCart();
  $("list").querySelectorAll(`[data-ctl="${n}"]`).forEach(el=>el.innerHTML=ctlHTML(n));
  if (dlg.open && view==="cart") renderCart();
  updateCartUI();
}

function onQtyClick(e){
  const b = e.target.closest("[data-inc],[data-dec]"); if(!b) return;
  const inc = b.hasAttribute("data-inc"), n = +(inc?b.dataset.inc:b.dataset.dec);
  const scope = b.closest("dialog") || $("list");
  setQty(n,(cart[n]||0)+(inc?1:-1));
  const h = scope.querySelector(`[data-ctl="${n}"]`);
  const t = h && (h.querySelector(inc?"[data-inc]":"[data-dec]") || h.querySelector("button"));
  if (t) t.focus(); else if (scope===dlg) $("dlg-title")?.focus();
}

function updateCartUI(){
  const lines = Object.keys(cart).length, sum = cartSum(), left = Math.max(0,MIN-sum);
  $("cart-top-n").textContent = lines ? ` · ${lines}` : "";
  $("cartbar").hidden = !lines;
  document.body.classList.toggle("has-cart", !!lines);
  $("cb-sum").textContent = rub(sum);
  $("cb-count").textContent = posWord(lines);
  $("cb-hint").textContent = left ? `До минимального заказа ещё ${rub(left)}` : "Минимальная сумма набрана";
  $("cb-fill").style.width = Math.min(100,sum/MIN*100)+"%";
}

const dlg = $("dlg");
let view = "cart", who = null, draft = {};

function head(title, back){
  return `<div class="dw-head"><div>${back?`<button type="button" class="rm back" data-go="cart">← Вернуться в корзину</button>`:""}<h2 id="dlg-title" tabindex="-1">${title}</h2></div><button type="button" class="x" data-close aria-label="Закрыть">×</button></div>`;
}

function renderCart(){
  view = "cart";
  const lines = cartLines(), sum = cartSum(), left = Math.max(0,MIN-sum);
  const body = lines.length ? lines.map(x=>`<div class="ci">
      <div class="t">${x.title}${x.pack?`<span class="pk">${x.pack}</span>`:""}</div>
      <div class="lp">${rub(x.p*x.q)}<small>${rub(x.p)} ${x.unit}</small></div>
      <div class="acts"><span data-ctl="${x.n}">${ctlHTML(x.n)}</span><button type="button" class="rm" data-rm="${x.n}">Удалить</button></div>
    </div>`).join("")
    : `<p class="dw-empty">Корзина пуста. Добавьте товары из каталога — минимальная сумма заказа 7&nbsp;000&nbsp;₽.</p>`;
  $("dw").innerHTML = head("Корзина") + `<div class="dw-body">${body}</div>` + (lines.length ? `<div class="dw-foot">
      <div class="total"><span>Итого, ${posWord(lines.length)}</span><b>${rub(sum)}</b></div>
      <div class="bar"><i style="width:${Math.min(100,sum/MIN*100)}%"></i></div>
      <p class="need${left?"":" ok"}">${left?`Минимальный заказ — 7&nbsp;000&nbsp;₽. Добавьте товаров ещё на ${rub(left)}.`:"Минимальная сумма набрана — можно оформлять."}</p>
      <button type="button" class="btn wide" data-go="checkout"${left?" disabled":""}>Оформить заказ</button>
    </div>` : "");
}

function renderCheckout(){
  view = "checkout";
  const sum = cartSum(), n = Object.keys(cart).length;
  const f = (name,label,type,attrs)=>`<label class="fld"><span>${label}</span><input name="${name}" type="${type}" ${attrs} value="${esc(draft[name]||"")}"></label>`;
  const comment = `<label class="fld"><span>Комментарий к заказу</span><textarea name="comment" placeholder="Удобное время доставки, замены, пожелания">${esc(draft.comment||"")}</textarea></label>`;
  let form = "";
  if (who==="org") form = `<p class="sec">Реквизиты</p>
      ${f("company","Название организации или ИП","text",'required autocomplete="organization"')}
      ${f("inn","ИНН","text",'required inputmode="numeric" pattern="\\d{10}|\\d{12}" title="10 цифр для ООО или 12 цифр для ИП"')}
      <p class="sec">Контакты</p>
      ${f("name","Контактное лицо","text",'required autocomplete="name"')}
      <div class="two">${f("phone","Телефон","tel",'required autocomplete="tel" placeholder="+7"')}${f("email","Почта для счёта","email",'required autocomplete="email"')}</div>
      ${f("address","Адрес доставки","text",'required autocomplete="street-address"')}
      ${comment}`;
  if (who==="person") form = `<p class="sec">Контакты</p>
      ${f("name","Имя и фамилия","text",'required autocomplete="name"')}
      <div class="two">${f("phone","Телефон","tel",'required autocomplete="tel" placeholder="+7"')}${f("email","Почта для чека","email",'required autocomplete="email"')}</div>
      ${f("address","Адрес доставки","text",'required autocomplete="street-address"')}
      ${comment}`;
  const agree = who ? `<label class="agree"><input type="checkbox" name="agree" required><span>Согласен на обработку персональных данных</span></label>` : "";
  const btn = who==="org" ? `<button type="submit" class="btn wide">Отправить заказ</button><p class="note">Проверим наличие и пришлём счёт на указанную почту. Оплата по безналичному расчёту.</p>`
            : who==="person" ? `<button type="submit" class="btn wide">Перейти к оплате · ${rub(sum)}</button><p class="note">Оплата банковской картой онлайн. Чек придёт на почту.</p>`
            : `<button type="button" class="btn wide" disabled>Выберите, кто оформляет заказ</button>`;
  $("dw").innerHTML = head("Оформление заказа", true) + `<form class="dw-form" id="co"><div class="dw-body">
      <div class="sumline"><span>${posWord(n)} в заказе</span><b>${rub(sum)}</b></div>
      <fieldset class="who"><legend class="sec">Кто оформляет заказ</legend>
        <label><input type="radio" name="who" value="org"${who==="org"?" checked":""}><b>ИП или ООО</b><span>Пришлём счёт на оплату по безналу</span></label>
        <label><input type="radio" name="who" value="person"${who==="person"?" checked":""}><b>Физическое лицо</b><span>Оплата картой на сайте</span></label>
      </fieldset>
      ${form}${agree}
    </div><div class="dw-foot">${btn}</div></form>`;
}

function renderDone(o){
  view = "done";
  const body = o.who==="org"
    ? `<h3>Заказ ${o.id} принят</h3><p>Проверим наличие и пришлём счёт на ${esc(o.contact.email)}. Если появятся вопросы — позвоним по номеру ${esc(o.contact.phone)}.</p>`
    : `<h3>Заказ ${o.id} оформлен</h3><p>Сумма к оплате — ${rub(o.total)}. Здесь откроется страница оплаты банковской картой.</p>`;
  $("dw").innerHTML = head("Спасибо!") + `<div class="dw-body"><div class="done"><span class="demo">Демо: отправка и оплата ещё не подключены</span>${body}</div></div>
    <div class="dw-foot"><button type="button" class="btn wide" data-close>Вернуться в каталог</button></div>`;
}

// Сюда позже подключается отправка заказа (почта / Telegram) и создание платежа для физлиц.
async function sendOrder(order){
  console.log("Новый заказ", order);
  return {ok:true};
}

function openCart(){ renderCart(); if (!dlg.open) dlg.showModal(); $("dlg-title")?.focus(); }
$("cart-top").onclick = openCart;
$("cart-bottom").onclick = openCart;
$("list").addEventListener("click", onQtyClick);

dlg.addEventListener("click", e=>{
  if (e.target===dlg) { dlg.close(); return; }
  if (e.target.closest("[data-close]")) { dlg.close(); return; }
  const g = e.target.closest("[data-go]");
  if (g) { g.dataset.go==="checkout" ? renderCheckout() : renderCart(); $("dlg-title")?.focus(); return; }
  const r = e.target.closest("[data-rm]");
  if (r) { setQty(+r.dataset.rm,0); $("dlg-title")?.focus(); return; }
  onQtyClick(e);
});
$("dw").addEventListener("input", e=>{ const t=e.target; if (t.name && t.name!=="who" && t.type!=="checkbox") draft[t.name]=t.value; });
$("dw").addEventListener("change", e=>{
  if (e.target.name!=="who") return;
  who = e.target.value; renderCheckout();
  $("dw").querySelector(`input[name="who"][value="${who}"]`).focus();
});
$("dw").addEventListener("submit", async e=>{
  e.preventDefault();
  const total = cartSum();
  if (!who || total<MIN) return;
  const btn = e.target.querySelector('[type="submit"]'); btn.disabled = true;
  const d = new Date();
  const order = {
    id: "№" + String(d.getMonth()+1).padStart(2,"0") + String(d.getDate()).padStart(2,"0") + "-" + Math.floor(1000+Math.random()*9000),
    created: d.toISOString(),
    who: who==="org" ? "org" : "person",
    buyer: who==="org" ? {company:draft.company, inn:draft.inn} : null,
    contact: {name:draft.name, phone:draft.phone, email:draft.email, address:draft.address},
    comment: draft.comment||"",
    items: cartLines().map(x=>({n:x.n, name:x.name, price:x.p, qty:x.q, sum:x.p*x.q})),
    total
  };
  const res = await sendOrder(order);
  if (!res.ok) { btn.disabled = false; return; }
  cart = {}; saveCart(); draft.comment = "";
  renderList(); updateCartUI();
  renderDone(order); $("dlg-title")?.focus();
});
updateCartUI();

nav = load("nav")==="type" ? "type" : "cat";
const s = load("sort"); if (s && $("sort").querySelector(`option[value="${s}"]`)) $("sort").value = s;
fromHash();
</script>

</body></html>
